<title>Sachet – Investment Message Checker</title>
<style>
:root{--bg:#f6f4ee;--ink:#1b2a2f;--mute:#5a6b70;--card:#fff;--line:#d9d6cb;--hi:#b3261e;--mid:#a86400;--lo:#1f7a4d;--acc:#0e4d64;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1d;--ink:#e8eef0;--mute:#9fb0b5;--card:#1b2629;--line:#33454a;--hi:#ff8a80;--mid:#ffc266;--lo:#6fd6a0;--acc:#7cc4dd}}
:root[data-theme="dark"]{--bg:#121a1d;--ink:#e8eef0;--mute:#9fb0b5;--card:#1b2629;--line:#33454a;--hi:#ff8a80;--mid:#ffc266;--lo:#6fd6a0;--acc:#7cc4dd}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Noto Sans Devanagari","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:700 1.9rem/1.15 Georgia,"Noto Serif Devanagari",serif;margin:0;color:var(--acc)}
.sub{color:var(--mute);margin:.3rem 0 1rem}
button,select{font:inherit;border-radius:8px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);padding:8px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--acc);color:var(--bg);font-weight:600}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
textarea{width:100%;min-height:150px;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.note{font-size:.9rem;color:var(--mute);border-left:4px solid var(--acc);padding:4px 10px;margin:12px 0}
#out{margin-top:18px}
.verdict{border-radius:12px;padding:16px;border:2px solid;background:var(--card)}
.verdict h2{margin:0 0 4px;font-size:1.35rem}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.flag{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:10px 12px;margin:8px 0}
.flag b{display:block}
ul.steps{padding-left:20px}
footer{margin-top:28px;font-size:.85rem;color:var(--mute)}
a{color:var(--acc)}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>
</head>

 </div>

function analyse(txt){
 const hits=R.filter(r=>r.re.test(txt));
 const raw=hits.reduce((a,r)=>a+r.w,0);
 // diminishing scale: ~10 raw points => 100
 const score=Math.min(100,Math.round(100*(1-Math.exp(-raw/6))));
 return{hits,score};
}
function render(){
 const t=T[L],txt=$("msg").value.trim(),o=$("out");
 if(!txt){o.innerHTML=`<div class="note">${t.empty}</div>`;return}
 const{hits,score}=analyse(txt);
 const lvl=score>=60?"high":score>=25?"mid":"low";
 const col={high:"var(--hi)",mid:"var(--mid)",low:"var(--lo)"}[lvl];
 const icon={high:"⛔",mid:"⚠️",low:"ℹ️"}[lvl];
 let h=`<div class="verdict" style="border-color:${col}"><h2 style="color:${col}">${icon} ${t[lvl]}</h2>
 <div>${t.score}: <b>${score}/100</b></div>
 <div class="bar" role="img" aria-label="${score} of 100"><i style="width:${score}%;background:${col}"></i></div></div>`;
 h+=`<h3>${t.why}</h3>`;
 if(!hits.length)h+=`<div class="flag" style="border-left-color:var(--lo)">${t.none}</div>`;
 hits.sort((a,b)=>b.w-a.w).forEach(r=>{const x=r[L];h+=`<div class="flag" style="border-left-color:${r.w>=3?'var(--hi)':'var(--mid)'}"><b>${x[0]}</b>${x[1]}</div>`});
 h+=`<h3>${t.next}</h3><ul class="steps">${t.steps.map(s=>`<li>${s}</li>`).join("")}</ul>
 <div class="note">${t.unc}</div><button id="spk">${t.listen}</button>`;
 o.innerHTML=h;
 lastSpeak=[t[lvl],t.score+" "+score,...hits.map(r=>r[L][0]),t.unc].join(". ");
 $("spk").onclick=()=>{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastSpeak);u.lang=L==="hi"?"hi-IN":"en-IN";speechSynthesis.speak(u)};
}
function setLang(l){
 L=l;const t=T[l];document.documentElement.lang=l;
 $("sub").textContent=t.sub;$("msg").placeholder=t.ph;$("lbl").textContent=t.ph;
 $("go").textContent=t.go;$("mic").textContent=t.mic;$("ex").textContent=t.ex;$("clr").textContent=t.clr;
 $("priv").textContent=t.priv;$("foot").textContent=t.foot;
 if($("out").innerHTML)render();
}
$("lang").onchange=e=>setLang(e.target.value);
$("go").onclick=render;
$("clr").onclick=()=>{$("msg").value="";$("out").innerHTML="";speechSynthesis&&speechSynthesis.cancel()};
$("ex").onclick=()=>{$("msg").value=EXAMPLES[L];render()};
$("mic").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("out").innerHTML=`<div class="note">${T[L].nomic}</div>`;return}
 const r=new SR();r.lang=L==="hi"?"hi-IN":"en-IN";r.interimResults=false;
 r.onresult=e=>{$("msg").value+=(" "+e.results[0][0].transcript).trim()+" "};
 r.onerror=()=>{$("out").innerHTML=`<div class="note">${T[L].nomic}</div>`};
 r.start();
};
setLang("en");
</script>
</body>
</html>
